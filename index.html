<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riham Gym for Women</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  :root{
    --cream:#FFF8F1;
    --cream-2:#FBEFE2;
    --gold:#C08A2E;
    --gold-deep:#8C5F1B;
    --rose:#E7B6B0;
    --rose-deep:#C98A83;
    --ink:#241F1B;
    --ink-soft:#5C534B;
    --white:#FFFFFF;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family:'Tajawal', sans-serif;
    background: var(--cream);
    color: var(--ink);
    overflow-x:hidden;
  }
  h1,h2,h3,.brand{ font-family:'Cairo', sans-serif; }

  .wrap{ max-width:640px; margin:0 auto; padding:0 22px; }

  /* HERO */
  .hero{
    background: radial-gradient(120% 100% at 50% 0%, #fff 0%, var(--cream-2) 55%, var(--cream) 100%);
    padding: 38px 0 30px;
    text-align:center;
    border-bottom: 1px solid #EFDFC9;
  }
  .logo{
    width:132px; height:132px; border-radius:50%;
    object-fit:cover;
    box-shadow: 0 8px 24px rgba(255, 0, 183, 0.995);
    border: 3px solid var(--white);
  }
  .eyebrow{
    margin-top:18px;
    color: var(--gold-deep);
    font-weight:700;
    font-size:14px;
    letter-spacing:.3px;
  }
  h1.headline{
    font-size: 27px;
    font-weight:800;
    margin: 8px 0 10px;
    line-height:1.5;
    color: var(--ink);
  }
  h1.headline span{ color: var(--gold); }
  .sub{
    color: var(--ink-soft);
    font-size:15.5px;
    line-height:1.9;
    margin:0 auto;
    max-width:480px;
  }

  /* UPGRADE STRIP */
  .upgrades{
    padding: 26px 0 6px;
  }
  .upgrades h2{
    font-size:19px;
    text-align:center;
    margin: 0 0 16px;
    color: var(--ink);
  }
  .cards{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
  }
  .card{
    background: var(--white);
    border: 1px solid #F0E2CE;
    border-radius: 16px;
    padding: 16px 14px;
    text-align:center;
  }
  .card .ic{ font-size:24px; display:block; margin-bottom:6px; }
  .card p{ margin:0; font-size:13.5px; color:var(--ink-soft); line-height:1.6; }

  /* REVIEW CTA */
  .review{
    padding: 34px 0 10px;
    text-align:center;
  }
  .review h2{
    font-size:21px;
    margin:0 0 8px;
  }
  .review p.desc{
    color: var(--ink-soft);
    font-size:14.5px;
    line-height:1.8;
    max-width:440px;
    margin: 0 auto 22px;
  }
  .stars{
    font-size: 30px;
    letter-spacing: 6px;
    color: #E7CBA3;
    margin-bottom: 22px;
  }
  .cta-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
    color:#fff;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:16.5px;
    padding: 16px 34px;
    border-radius: 999px;
    text-decoration:none;
    box-shadow: 0 10px 26px rgba(140,95,27,0.30);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .cta-btn:active{ transform: scale(.97); }
  .note{
    margin-top:16px;
    font-size:12.5px;
    color:#9A8E7F;
  }

  footer{
    text-align:center;
    padding: 34px 0 26px;
    color:#B7A98F;
    font-size:12px;
  }
  footer a{ color:#B7A98F; text-decoration:none; }

  /* ADMIN */
  .admin-wrap{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    background: var(--cream);
  }
  .admin-card{
    background:#fff;
    border:1px solid #F0E2CE;
    border-radius:20px;
    padding:30px 26px;
    max-width:360px;
    width:100%;
    text-align:center;
    box-shadow: 0 14px 34px rgba(140,95,27,0.12);
  }
  .admin-card h2{ font-size:19px; margin:12px 0 4px; }
  .admin-card p{ color:var(--ink-soft); font-size:13.5px; line-height:1.7; margin:0 0 18px; }
  .admin-card input{
    width:100%;
    padding:13px 14px;
    border-radius:12px;
    border:1px solid #E7D9C4;
    font-family:'Tajawal', sans-serif;
    font-size:15px;
    margin-bottom:12px;
    text-align:center;
    background:#FCF6EC;
  }
  .admin-card input:focus{ outline:2px solid var(--gold); }
  .admin-btn{
    width:100%;
    border:none;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
    color:#fff;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:13px;
    border-radius:12px;
    cursor:pointer;
  }
  .err{ color:#B4453D; font-size:13px; min-height:18px; margin-bottom:4px; }
  .admin-logo{ width:64px; height:64px; border-radius:50%; object-fit:cover; }
  .go-link{
    display:block; margin-top:16px; font-size:13px; color: var(--gold-deep); text-decoration:none;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#221D18; --cream-2:#2A2219; --white:#2E2620;
      --ink:#F3E9DC; --ink-soft:#C9BBA6;
    }
    body{ background:var(--cream); }
    .card, .admin-card{ background:var(--white); border-color:#3A2F22; }
    footer{ color:#7C7060; }
    .admin-card input{ background:#241F19; border-color:#3A2F22; color:var(--ink); }
  }
</style>
</head>

  if(val === ADMIN_PASSWORD){
    render('dashboard');
  } else {
    document.getElementById('err').textContent = 'كلمة السر غلط، حاولي تاني';
  }
}

function render(mode){
  const app = document.getElementById('app');
  if(mode === 'admin') app.innerHTML = adminGate();
  else if(mode === 'dashboard') app.innerHTML = adminDashboard();
  else app.innerHTML = publicPage();
}

function route(){
  render(window.location.hash === '#admin' ? 'admin' : 'public');
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
